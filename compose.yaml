services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elixir_chat}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: development
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/app/docker-entrypoint-dev.sh"]
    command: ["mix", "phx.server"]
    environment:
      DB_HOST: db
      PHX_IP: 0.0.0.0
      PORT: 4000
      POSTGRES_DB: ${POSTGRES_DB:-elixir_chat}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POOL_SIZE: ${POOL_SIZE:-10}
      POOL_COUNT: ${POOL_COUNT:-1}
      DB_SLOW_QUERY_MS: ${DB_SLOW_QUERY_MS:-500}
      DB_QUEUE_WARN_MS: ${DB_QUEUE_WARN_MS:-100}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-7}
    volumes:
      - .:/app
      - mix_deps:/app/deps
      - mix_build:/app/_build
    ports:
      - "${PORT:-4000}:4000"

volumes:
  postgres_data:
  mix_deps:
  mix_build:
